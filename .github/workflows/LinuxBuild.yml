name: LinuxBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
           sudo apt-get update
           sudo apt-get install -y g++-13 cmake

    - name: Initialize Sub-modules
      run: |
        git submodule init
        git submodule update
    
    - name: Build (make)
      run: |
           cd PSEMU
           make

    - name: Build (cmake)
      run: |
           cmake -S PSEMU -B build -DCMAKE_CXX_COMPILER=g++-13
           cmake --build build

    - name: Test (R3000 CPU, no BIOS needed)
      run: |
           cd PSEMU
           make test
